<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <style>
    .light { display: none; }
    @media (prefers-color-scheme: light) { .light { display: inline; } .dark { display: none; } }
  </style>
  <image class="dark" x="4" y="4" width="120" height="120" xlink:href="data:image/png;base64,"/>
  <image class="light" x="4" y="4" width="120" height="120" xlink:href="data:image/png;base64,"/>
</svg>
